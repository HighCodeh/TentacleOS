name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: pip install clang-format==22.1.5

      - name: Run format check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          bash tools/format.sh --check-changed "$BASE_SHA"

  commitlint:
    name: Validate Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  build:
    name: Build ${{ matrix.target }} application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: p4
            idf: v5.5.3
            project: TentacleOS_P4
          - target: c5
            idf: v6.0.1
            project: TentacleOS_C5
    container:
      image: espressif/idf:${{ matrix.idf }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: bash tools/build.sh "${{ matrix.target }}"
        shell: bash

      - name: Upload app-only build evidence
        uses: actions/upload-artifact@v4
        with:
          name: highboy-${{ matrix.target }}-app-only
          if-no-files-found: error
          path: |
            firmware_${{ matrix.target }}/build_highboy/${{ matrix.project }}.bin
            firmware_${{ matrix.target }}/build_highboy/${{ matrix.project }}.elf
            firmware_${{ matrix.target }}/build_highboy/${{ matrix.project }}.map
            firmware_${{ matrix.target }}/build_highboy/sdkconfig
            firmware_${{ matrix.target }}/build_highboy/partition_table/partition-table.bin

  host-tests:
    name: High Boy offline regression tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
      - name: Run source contracts and host regressions
        run: bash tools/highboy/test.command

  hle-tests:
    name: HLE Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -B build -S tools/hle -DHLE_BUILD_INTERACTIVE=OFF
        env:
          SDL_VIDEODRIVER: dummy

      - name: Build tests
        run: cmake --build build --target hle_tests -j$(nproc)

      - name: Run tests
        run: ./build/hle_tests
